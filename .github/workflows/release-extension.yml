name: Build Extension Zip Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump extension patch version
        id: version
        run: |
          NEXT_VERSION=$(node -e "const fs=require('fs'); const manifestPath='manifest.json'; const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8')); const parts=String(manifest.version).split('.').map(Number); if (parts.length !== 3 || parts.some(Number.isNaN)) { throw new Error('manifest version must be semver x.y.z'); } parts[2] += 1; manifest.version = parts.join('.'); fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\\n'); process.stdout.write(manifest.version);")
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push bumped manifest version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump extension version to ${{ steps.version.outputs.tag }} [skip ci]"
          git push

      - name: Build distributable zip
        run: |
          mkdir -p dist
          ZIP_NAME="IntentionalTube-v${{ steps.version.outputs.version }}.zip"
          zip -r "dist/$ZIP_NAME" . \
            -x ".git/*" \
               ".github/*" \
               "site/*" \
               "dist/*" \
               "IntentionTube- YT Distraction Blocker.zip"

      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: IntentionalTube ${{ steps.version.outputs.tag }}
          body: Automated extension package from the latest main branch.
          artifacts: dist/*.zip
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
